name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build the image
        run: docker build --platform linux/amd64 -t loan-default:dev .

      # The container test fails (rather than skips) if the image is missing.
      - name: Run tests
        run: python -m pytest -ra
        env:
          REQUIRE_CONTAINER: "1"

  # Publishes the tested image. Runs only for pushes to main, after the tests pass.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA::7} .

      - name: Push to GitHub Container Registry
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::7}

  # Points the Azure container app at the image just published, then checks it is up.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job prove its identity to Azure (OIDC)
      contents: read
    env:
      RESOURCE_GROUP: rg-loan-default
      APP_NAME: loan-default-api
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A new tag each time forces a new revision; "latest" would not.
      - name: Deploy the new image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}
          # --output none: the default output is the whole app definition, including its public address.
          az containerapp update --name $APP_NAME --resource-group $RESOURCE_GROUP --image $IMAGE --output none

      - name: Check the service is healthy
        run: |
          FQDN=$(az containerapp show --name $APP_NAME --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "::add-mask::$FQDN"
          for i in $(seq 1 12); do
            curl -sf https://$FQDN/health && exit 0
            sleep 10
          done
          echo "Service did not become healthy" && exit 1
