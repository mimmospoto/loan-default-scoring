[project]
name = "loan-default-scoring"
version = "0.1.0"
description = "Credit default scoring service: from training to a live, monitored API"
readme = "README.md"
requires-python = ">=3.12"
# Lower bounds only; exact versions are pinned in the lockfile.
dependencies = [
    "pandas>=2.2",
]

[dependency-groups]
# Only needed to fetch the raw data, never in the serving image.
data = [
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loan_default"]
